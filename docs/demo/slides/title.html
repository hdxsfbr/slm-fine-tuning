<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hint-only chess coach</title>
<link rel="stylesheet" href="base.css">
<style>
  .slide { justify-content: center; }
  h1 { font-size: 124px; line-height: 1.02; }
  .tagline { margin: 36px 0 0; max-width: 1080px; font-size: 36px; line-height: 1.4; color: var(--body); }
  .meta { margin-top: 56px; color: var(--muted); font-size: 26px; }
  .pieces { font-size: 92px; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 28px; line-height: 1; }
</style>
</head>
<body>
<main class="slide">
  <div class="pieces">&#9816; &#9814; &#9813;</div>
  <h1>Hint-only<br>chess coach</h1>
  <div class="rule"></div>
  <p class="tagline">A 1.7B model that only ever hints: it never names the move or a square for your position, however you ask, and answers every other chess question in full.</p>
  <p class="meta">Qwen3-1.7B, QLoRA, one rule. Andre Batista, 2026.</p>
</main>
</body>
</html>
